<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Batch WAV → WEM (debug)</title>
<style>
  body { font-family: system-ui, sans-serif; background:#0b0b0e; color:#eee; max-width:640px; margin:40px auto; padding:0 16px; }
  h1 { font-size: 1.3rem; }
  #drop { border: 2px dashed #444; border-radius: 12px; padding: 32px; text-align:center; cursor:pointer; margin: 16px 0; }
  #drop.drag { border-color:#7aa; background:#111; }
  #filelist { font-size: 0.9rem; color:#aaa; margin: 8px 0 16px; white-space: pre-line; }
  button { background:#4a7; color:#fff; border:0; border-radius:8px; padding:10px 18px; font-size:1rem; cursor:pointer; }
  button:disabled { opacity:0.5; cursor:default; }
  label { display:block; margin: 8px 0; font-size:0.9rem; color:#ccc; }
  input[type=number] { width:60px; }
  #status { margin-top:12px; font-size:0.9rem; }
</style>
</head>
<body>
  <h1>Batch WAV → WEM (debug, không patch bnk)</h1>
  <p style="color:#999;font-size:0.9rem">Upload nhiều file .wav cùng lúc → tải về 1 file zip chứa .wem tương ứng, giữ nguyên tên gốc.</p>

  <div id="drop">📂 Kéo thả nhiều file .wav vào đây, hoặc bấm để chọn</div>
  <input type="file" id="fileInput" accept=".wav" multiple style="display:none">
  <div id="filelist"></div>

  <label>Chất lượng libvorbis (-1 đến 10): <input type="number" id="quality" value="5" min="-1" max="10"></label>

  <button id="submitBtn" disabled>Encode & Tải zip</button>
  <div id="status"></div>

<script>
const drop = document.getElementById('drop');
const fileInput = document.getElementById('fileInput');
const filelist = document.getElementById('filelist');
const submitBtn = document.getElementById('submitBtn');
const statusEl = document.getElementById('status');
let files = [];

drop.addEventListener('click', () => fileInput.click());
drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('drag'); });
drop.addEventListener('dragleave', () => drop.classList.remove('drag'));
drop.addEventListener('drop', e => {
  e.preventDefault();
  drop.classList.remove('drag');
  setFiles(e.dataTransfer.files);
});
fileInput.addEventListener('change', () => setFiles(fileInput.files));

function setFiles(fl) {
  files = Array.from(fl).filter(f => f.name.toLowerCase().endsWith('.wav'));
  filelist.textContent = files.length
    ? files.map(f => `• ${f.name} (${(f.size/1024/1024).toFixed(2)} MB)`).join('\n')
    : 'Chưa có file .wav nào được chọn.';
  submitBtn.disabled = files.length === 0;
}

submitBtn.addEventListener('click', async () => {
  submitBtn.disabled = true;
  statusEl.textContent = `Đang encode ${files.length} file...`;

  const form = new FormData();
  files.forEach(f => form.append('files', f, f.name));
  form.append('quality', document.getElementById('quality').value);

  try {
    const res = await fetch('/api/batch-wem', { method: 'POST', body: form });
    if (!res.ok) {
      const text = await res.text();
      throw new Error(`Server lỗi (${res.status}): ${text}`);
    }
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'batch_wem.zip';
    a.click();
    URL.revokeObjectURL(url);
    statusEl.textContent = `Xong! Đã tải batch_wem.zip (${files.length} file).`;
  } catch (err) {
    statusEl.textContent = `Lỗi: ${err.message}`;
  } finally {
    submitBtn.disabled = false;
  }
});
</script>
</body>
</html>
